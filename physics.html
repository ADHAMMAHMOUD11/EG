<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفيزياء</title>

<style>
body {
    font-family: "Tajawal", sans-serif;
    background: #121212;
    color: white;
    margin: 0;
    padding: 20px;
}

/* العنوان */
h1 {
    text-align: center;
    color: #ff9800;
    margin-bottom: 10px;
}

/* زر الامتحان */
.exam-btn {
    display: flex;
    justify-content: center;
    margin-bottom: 25px;
}

.exam-btn button {
    padding: 12px 25px;
    background: #ff9800;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
}

/* الكتب */
.books {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.book {
    background: #1e1e1e;
    border: 1px solid #ff9800;
    border-radius: 12px;
    text-align: center;
    padding: 10px;
    transition: .3s;
    cursor: pointer;
}

.book:hover {
    transform: scale(1.05);
    background: #252525;
}

.book img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 8px;
}

.book-name {
    margin-top: 10px;
    font-size: 18px;
    color: #ff9800;
}

/* الفوتر */
footer {
    text-align: center;
    margin-top: 30px;
    opacity: .7;
}
</style>
</head>

<body>

<h1>الفيزياء - كتب المذاكرة</h1>

<div class="exam-btn">
    <button onclick="goExam()">امتحاني</button>
</div>

<div class="books" id="booksContainer"></div>

<script>
// ملفات PDF للفيزياء
const pdfFiles = [
    "physics1.pdf",
    "physics2.pdf",
    "physics3.pdf",
    "physics4.pdf",
    "physics5.pdf"
];

// إنشاء العناصر تلقائيًا
const container = document.getElementById("booksContainer");

pdfFiles.forEach(file => {
    const div = document.createElement("div");
    div.classList.add("book");
    div.innerHTML = `
        <img src="placeholder.png" alt="صورة الكتاب">
        <div class="book-name">${file}</div>
        <a href="${file}" target="_blank"
           style="display:block;margin-top:8px;color:#ff9800;text-decoration:none;">
           فتح / تحميل
        </a>
    `;
    container.appendChild(div);
});

// زر امتحاني
function goExam() {
    window.location.href = "physics_exam.html";
}
</script>
<footer>جميع الحقوق محفوظة لـ EG©</foote
</body>
    </html>
