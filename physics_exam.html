<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امتحان الفيزياء</title>

<style>
body{
    font-family:Tajawal,sans-serif;
    background:#121212;
    color:white;
    text-align:center;
    padding:20px;
}
h1,h2{color:#ff9800}

#examSection,#otpSection{display:none}
#timer{font-size:24px;color:#ff9800;margin-bottom:20px}

.question{
    background:#1e1e1e;
    padding:15px;
    border-radius:12px;
    margin-bottom:18px;
    border:1px solid #ff9800;
}

.question img{
    width:100%;
    max-width:1280px;
    height:450px;
    object-fit:cover;
    border-radius:10px;
    margin:15px auto;
    display:block;
    cursor:pointer;
}

/* نافذة عرض الصورة كاملة */
#imgModal{
    display:none;
    position:fixed;
    z-index:999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
}
#imgModal img{
    max-width:90%;
    max-height:90%;
    border-radius:10px;
}
#imgModal span{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:40px;
    cursor:pointer;
}
label{
    display:block;
    margin:8px 0;
    padding:10px;
    border:1px solid #ff9800;
    border-radius:25px;
    cursor:pointer;
}
input[type=radio]{display:none}
input[type=radio]:checked + span{
    background:#ff9800;
    color:#000;
    padding:10px 20px;
    border-radius:25px;
}

button{
    padding:15px 35px;
    border-radius:50px;
    background:#ff9800;
    border:none;
    color:white;
    font-size:18px;
    cursor:pointer;
}

input{
    width:90%;
    max-width:400px;
    padding:15px;
    margin-bottom:20px;
    border-radius:30px;
    border:none;
    text-align:center;
}
</style>
</head>

<body>

<h1>امتحان الفيزياء</h1>

<div id="phoneSection">
<h2>أدخل رقم هاتفك</h2>
<input id="phone" placeholder="رقم الهاتف">
<br>
<button onclick="sendOTP()">إرسال OTP</button>
</div>

<div id="otpSection">
<h2>أدخل كود التحقق</h2>
<input id="otpInput" placeholder="كود التحقق">
<br>
<button onclick="verifyOTP()">تحقق</button>
</div>

<div id="examSection">
<div id="timer">17:00</div>
<div id="questionsContainer"></div>
<button onclick="submitExam()">تسليم الامتحان</button>
</div>

<!-- نافذة عرض الصورة كاملة -->
<div id="imgModal">
    <span onclick="closeModal()">&times;</span>
    <img id="modalImg" src="">
</div>

<script>
const BOT_TOKEN="8182981848:AAFESqf1hVM0JSEvywhXJdk5asGJlOq6q00";
const CHAT_ID="7020597309";
const WHATSAPP_NUMBER="201102323525";
const REDIRECT_URL="https://adhammahmoud11.github.io/EG1/";
const examName="امتحان الفيزياء";

let realOTP="", phoneNumber="", startTime, timerInterval;
let examStarted = false; // لتحديد اذا بدأ الامتحان

const questions=[
{q:"(1): الشكل (2) يمثل دائرة كهربية تستخدم لتعيين مقاومة موصل معدني. أي الخطوط البيانية X , Y , Z , K في الشكل(2) يوضح العلاقة بين قيمة مقاومة الموصل وقراءة الأميتر؟", img:"p1.png", options:["X","Y","Z","K"], correct:"Y"},
{q:"(2): في الشكل المقابل: أي الأشكال البيانية الآتية تمثل العلاقة بين شدة التيار المار في المقاومة R وزمن مروره؟", img:"p2.png", options:["الشكل (1)","الشكل (2)","الشكل (3)"], correct:"الشكل (1)"},
{q:"(3): الشكل المقابل يمثل العلاقة البيانية بين المقاومة (R) ومقلوب مساحة المقطع (1/A) لموصلين (1) و(2) كلٌ على حدة. فإذا كانت النسبة بين طوليْهما (ℓ₁ / ℓ₂ = √3 / 2)، فإن النسبة بين قيم المقاومية النوعية لمادتي الموصلين (ρe₁ / ρe₂) هي:", img:"p3.png", options:["2 / 1","2 / 3","1 / √2","1 / √3"], correct:"2 / 1"},
{q:"(4): في تجربة لإثبات صحة قانون أوم، كان الشكل (1) يمثل دائرة كهربية مغلقة، وكان الشكل (2) يمثل العلاقة البيانية بين فرق الجهد (V) بين طرفي المقاومة (R) وشدة التيار (I) المار بها. فإن الاختيار الذي لا يمثل قراءة الأميتر والفولتميتر على الترتيب في الدائرة الكهربية عند أي لحظة هو:", img:"p4.png", options:["4V , 1A","0.8V, 0.2A","1.2V, 0.3A","3.2V, 0.6A"], correct:"3.2V, 0.6A"},
{q:"(5): الشكل المقابل يمثل موصلين معدنيين (X) و(Y) منتظمي المقطع، معلوم على كلٍ منهما طوله ونصف قطر مقطعه. إذا كانت العلاقة بين مقاومتي السلكين (Rₓ = 2 Rᵧ)، فإن النسبة المقاومية النوعية لمادة الموصل (X) / المقاومية النوعية لمادة الموصل (Y) تساوي:", img:"p5.png", options:["8 / 3","4 / 3","3 / 2","2 / 3"], correct:"8 / 3"},
{q:"(6): سلكان (1) و(2) مصنوعان من نفس المادة. طول السلك (1) يساوي( 3ℓ) ونصف قطره r، بينما طول السلك  يساوي( 2ℓ) ونصف قطره 2r كما هو موضح بالشكل، فإن النسبة بين (I₁ / I₂) تساوي:", img:"p6.png", options:["12 / 1","1 / 12","3 / 2","1 / 6"], correct:"1 / 12"},
{q:"(7): مثلت بيانياً العلاقة بين المقاومة الكهربية (R) ومقلوب مساحة المقطع (1/A) لكل سلك من ثلاثة أسلاك منتظمة المقطع (X , Y , Z) من مواد مختلفة، ونفس الطول كل على حدة فإن العلاقه بين قيم المقاومه النوعية Pₑ لمواد الاسلاك الثلاثه تكون:", img:"p7.png", options:["ρₑx = ρₑy = ρₑz","ρₑx > ρₑy > ρₑz","ρₑz > ρₑy > ρₑx","ρₑy > ρₑx > ρₑz"], correct:"ρₑx > ρₑy > ρₑz"},
{q:"(8): إذا قل طوله للنصف وزادت مساحة مقطعه للضعف فإن مقاومته النوعية:", options:["تقل للربع","تزداد 4 أمثالها","لا تتغير","تزداد للضعف"], correct:"لا تتغير"},
{q:"(9): الشكل البياني يعبر عن العلاقة بين متغيرين، فإن الشكل الذي يعبر عن العلاقة بين المقاومة النوعية لموصل ونصف قطره هو:", img:"p9.png", options:["الشكل (1)","الشكل (2)","الشكل (3)","الشكل (4)"], correct:"الشكل (3)"},
{q:"(10): الشكل المقابل يمثل العلاقة البيانية بين المقاومة الكهربية (R) والطول (ℓ) لكلٍ على حدة لثلاثة أسلاك موصلة للتيار الكهربي (X , Y , Z)، فإذا علمت أن قيم مساحة مقطع كل من الأسلاك الثلاثة هي (A ، 2A ، 2A) على الترتيب، تكون العلاقة بين قيم المقاومة النوعية لمادة الأسلاك هي:", img:"p10.png", options:["ρₑx > ρₑy > ρₑz","ρₑx < ρₑy < ρₑz","ρₑx > ρₑy = ρₑz","ρₑz > ρₑx > ρₑy"], correct:"ρₑx > ρₑy > ρₑz"}
];

function sendOTP(){
  phoneNumber = phone.value.trim();
  if(!/^01[0125][0-9]{8}$/.test(phoneNumber)) return alert("رقم غير صحيح");
  realOTP = Math.floor(1000 + Math.random()*9000) + "";
  phoneSection.style.display = "none";
  otpSection.style.display = "block";
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(
    `OTP\n${phoneNumber}\n${realOTP}\n${examName}`
  )}`);
}

function verifyOTP(){
  if(otpInput.value.trim() === realOTP){
    otpSection.style.display = "none";
    startExam();
  } else alert("كود خطأ");
}

function startExam(){
  examSection.style.display = "block";
  examStarted = true; // بدأ الامتحان
  startTime = new Date();
  questionsContainer.innerHTML = "";
  questions.forEach((q,i)=>{
    let h = `<div class="question"><h3>${q.q}</h3>`;
    if(q.img) h += `<img src="${q.img}" onclick="openModal(this)">`;
    q.options.forEach(o=>{
      h += `<label><input type="radio" name="q${i}" value="${o}"><span>${o}</span></label>`;
    });
    h += "</div>";
    questionsContainer.innerHTML += h;
  });
  startTimer(17*60); // 17 دقيقة
}

// منع الخروج أثناء الامتحان
window.addEventListener("beforeunload", function (e) {
  if(examStarted){
    e.preventDefault();
    e.returnValue = "الامتحان لم يُسلم بعد! هل أنت متأكد من الخروج؟";
  }
});

function startTimer(s){
  let r = s;
  timerInterval = setInterval(()=>{
    timer.innerText = String(Math.floor(r/60)).padStart(2,"0")+":"+
                      String(r%60).padStart(2,"0");
    if(r-- <= 0){ clearInterval(timerInterval); submitExam(); }
  }, 1000);
}

function openModal(img){
  document.getElementById("modalImg").src = img.src;
  document.getElementById("imgModal").style.display = "flex";
}
function closeModal(){
  document.getElementById("imgModal").style.display = "none";
}

function submitExam(){
  clearInterval(timerInterval);
  examStarted = false; // انتهاء الامتحان
  let score = 0;
  questions.forEach((q,i)=>{
    const sel = [...document.getElementsByName("q"+i)].find(r=>r.checked);
    if(sel && sel.value === q.correct) score++;
  });
  const percent = Math.round(score/questions.length*100);

  if(percent === 100){
    window.location.href=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(
      "أخيراً خلصت امتحانات ونجحت، الحمد لله رب العالمين 🎉🎓"
    )}`;
  } else {
    window.location.href = REDIRECT_URL;
  }
}
</script>

</body>
    </html>
