    <!-- مربع الساعة 12 ساعة -->
<div id="realClock" style="
    font-family: Arial, sans-serif;
    font-size: 20px;
    font-weight: bold;
    color: #ff6f00; /* برتقالي غامق */
    background: #222;
    padding: 10px 15px;
    border-radius: 8px;
    display: inline-block;
    box-shadow: 0 0 8px #ff6f00;
">
00:00 AM
</div>

<script>
function updateRealClock() {
    const now = new Date();
    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();

    // تحويل نظام 24 ساعة إلى 12 ساعة
    let ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12; // إذا كانت الساعة 0 تصبح 12

    // إضافة صفر للأرقام الأقل من 10
    hours = hours < 10 ? '0' + hours : hours;
    minutes = minutes < 10 ? '0' + minutes : minutes;
    seconds = seconds < 10 ? '0' + seconds : seconds;

    document.getElementById('realClock').textContent = hours + ':' + minutes + ' ' + ampm;
}

// تحديث الساعة كل ثانية
setInterval(updateRealClock, 1000);
updateRealClock(); // تحديث مباشر عند تحميل الصفحة
</script>

<h2>للشكوى والاقتراحات 🔻</h2>

<div class="contact-container">
    <img src="Contact.png" alt="صورة تواصل معنا">

    <input type="text" id="studentName" placeholder="اكتب اسمك هنا">
    <input type="text" id="studentPhone" placeholder="اكتب رقمك المصري هنا">
    
    <textarea id="message" rows="5" placeholder="اكتب رسالتك هنا..."></textarea>
    
    <button onclick="sendMessage()">إرسال</button>
</div>

<script>
const BOT_TOKEN = "8444690767:AAENxXF6CV0TozG5fD9Kwc3R6SO4UaLeoa0";
const CHAT_ID = "7020597309";

function openSubject(page){
    window.location.href = page;
}

function isValidEgyptianNumber(num){
    return /^(01)[0-2,5][0-9]{8}$/.test(num);
}

function sendMessage(){
    const name = document.getElementById("studentName").value.trim();
    const phone = document.getElementById("studentPhone").value.trim();
    const msg = document.getElementById("message").value.trim();

    if(!name || !phone || !msg){
        alert("❌ من فضلك املأ جميع الحقول");
        return;
    }

    if(!isValidEgyptianNumber(phone)){
        alert("❌ يجب إدخال رقم صحيح مكون من 11 رقم ويبدأ بـ 01");
        return;
    }

    const text =
`📩 رسالة جديدة من الموقع
👤 الاسم: ${name}
📞 رقم الهاتف: ${phone}
💬 الرسالة:
${msg}`;

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`)
    .then(res => {
        if(res.ok){
            alert("✔ تم إرسال رسالتك بنجاح شكرا لك وسيتم الرد عليك في اقرب وقت");
            document.getElementById("message").value = "";
        } else {
            alert("❌ حدث خطأ، حاول مرة أخرى");
        }
    })
    .catch(err => {
        alert("⚠ خطأ في الاتصال: " + err);
    });
}
</script>
